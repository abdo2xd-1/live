name: Manual 6-Hour YouTube Stream

on:
  workflow_dispatch: # الأمر ده هو اللي بيعمل زرار التشغيل اليدوي

jobs:
  live-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Install FFmpeg
        run: sudo apt update && sudo apt install ffmpeg -y
        
      - name: Start Streaming
        run: |
          ffmpeg -re -stream_loop -1 -i "video.mp4" -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 -f flv "rtmp://a.rtmp.youtube.com/live2/${{ secrets.YOUTUBE_STREAM_KEY }}"
